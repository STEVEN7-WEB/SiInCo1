<div class="user-wrapper">

  <!-- PANEL IZQUIERDO -->
  <div class="user-left">
    <div class="logo-box"></div>

    <nav class="menu-grid">
      <button class="menu-item" (click)="navegar('crear-solicitud')">
        <span>➕</span>
        <p>Crear</p>
      </button>

      <button class="menu-item" (click)="navegar('mis-solicitudes')">
        <span>📄</span>
        <p>Solicitudes</p>
      </button>

      <button class="menu-item" (click)="navegar('mi-perfil')">
        <span>👤</span>
        <p>Perfil</p>
      </button>

      <button class="menu-item" (click)="navegar('configuracion')">
        <span>📹</span>
        <p>¿Qué hacemos?</p>
      </button>

      <button class="menu-item" (click)="navegar('ayuda')">
        <span>❓</span>
        <p>Contacto</p>
      </button>

      <button class="menu-item logout-btn" (click)="cerrarSesion()">
        <span>🚪</span>
        <p>Salir</p>
      </button>
    </nav>
  </div>

  <!-- PANEL DERECHO -->
  <div class="user-right">
    <!-- Contenido dinámico animado -->
    <div class="content-box" [@fadeInAnimation]>
      <router-outlet></router-outlet>
    </div>
  </div>

</div>
