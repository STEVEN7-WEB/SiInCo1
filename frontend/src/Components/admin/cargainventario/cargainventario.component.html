<div class="contenedor">

  <h2>Carga de Inventario</h2>

  <form [formGroup]="inventarioForm" (ngSubmit)="enviarInventario()" class="form-grid">

    <!-- Nombre, Cantidad, Precio -->
    <div class="row-3">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" formControlName="nombre">
      </div>

      <div class="form-group">
        <label>Cantidad</label>
        <input type="number" formControlName="cantidad" min="1">
      </div>

      <div class="form-group">
        <label>Precio</label>
        <input type="number" formControlName="precio" min="1" step="0.01">
      </div>
    </div>

    <!-- Descripción -->
    <div class="form-group descripcion-box">
      <label>Descripción</label>
      <textarea formControlName="descripcion"></textarea>
    </div>

    <button type="submit" [disabled]="inventarioForm.invalid">
      Guardar Producto
    </button>

  </form>

  <!-- Toast de éxito -->
  <div class="toast" *ngIf="toastVisible">
    ✔ Producto guardado con éxito
  </div>

</div>
