<div class="contenedor-formulario">
  <h2>Registrar Solicitud de Mantenimiento</h2>

  <form [formGroup]="formularioMantenimiento" (ngSubmit)="enviarSolicitud()">

    <!-- FILA 1: Marca, color, SO -->
    <div class="fila fila-de-tres">
      <div class="campo">
        <label>Marca del equipo *</label>
        <select formControlName="marca">
          <option value="" disabled selected>Selecciona una marca...</option>
          <option value="Asus">Asus</option>
          <option value="Lenovo">Lenovo</option>
          <option value="HP">HP</option>
          <option value="Dell">Dell</option>
        </select>
      </div>

      <div class="campo">
        <label>Color *</label>
        <select formControlName="color">
          <option value="" disabled selected>Selecciona un color...</option>
          <option value="Gris">Gris</option>
          <option value="Negro">Negro</option>
          <option value="Blanco">Blanco</option>
          <option value="Rojo">Rojo</option>
          <option value="Azul">Azul</option>
        </select>
      </div>

      <div class="campo">
        <label>Sistema Operativo *</label>
        <select formControlName="sistemaOperativo">
          <option value="" disabled selected>Selecciona un SO...</option>
          <option value="Windows 11">Windows 11</option>
          <option value="Windows 10">Windows 10</option>
          <option value="macOS">macOS</option>
          <option value="Linux">Linux</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
    </div>

    <!-- FILA 2: Título y mensaje de error -->
    <div class="fila">
      <div class="campo">
        <label>Título breve del problema *</label>
        <input type="text" formControlName="titulo">
      </div>

      <div class="campo">
        <label>Detalles del equipo *</label>
        <input type="text" formControlName="mensajeError">
      </div>
    </div>

    <!-- FILA 3: Descripción + programa -->
    <div class="fila">
      <div class="campo">
        <label>Descripción detallada *</label>
        <textarea formControlName="descripcion"></textarea>
      </div>

      <div class="campo">
        <label>Programa a instalar (opcional)</label>
        <input type="text" formControlName="nombrePrograma"
               [disabled]="!formularioMantenimiento.get('instalaPrograma')?.value">

        <label>
          <input type="checkbox" formControlName="instalaPrograma">
          Instalar programa
        </label>
      </div>
    </div>

    <!-- FILA 4: OTROS CHECKBOX -->
    <div class="fila">
      <label><input type="checkbox" formControlName="instalaRam"> Instalar RAM</label>
      <label><input type="checkbox" formControlName="instalaSsd"> Instalar SSD</label>
      <label><input type="checkbox" formControlName="mantenimiento"> Mantenimiento general</label>
    </div>

    <!-- FILA 5: Confirmación -->
    <div class="fila">
      <label>
        <input type="checkbox" formControlName="aceptaConfirmacion">
        Acepto los términos *
      </label>
    </div>

    <button type="submit">Enviar Solicitud</button>

  </form>
</div>
